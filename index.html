<!DOCTYPE html>

  <script>
    /* Applies a saved manual light/dark choice before first paint, so
       there's no flash of the wrong theme. See applyTheme()/toggleTheme()
       in src/main.js — this mirrors that logic just enough to run early. */
    (function() {
      try {
        var t = localStorage.getItem('mamaminds-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
